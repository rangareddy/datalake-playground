services:
  hive-metastore:
    image: rangareddy1988/ranga-hive:${IMAGE_VERSION:-1.0.0}
    platform: ${PLATFORM:-linux/amd64}
    container_name: hive-metastore
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DB_DRIVER: postgres
      SERVICE_NAME: "metastore"
      VERBOSE: "true"
    ports:
      - "9083:9083"
    volumes:
      - ./logs/metastore/:/tmp/hive/
    healthcheck:
      test: bash -c "exec 6<> /dev/tcp/localhost/9083"
      start_period: 50s
      start_interval: 20s
      interval: 50s
      timeout: 30s
      retries: 10
    networks:
      - datalake

  hive-server:
    image: rangareddy1988/ranga-hive:${IMAGE_VERSION:-1.0.0}
    platform: ${PLATFORM:-linux/amd64}
    container_name: hive-server
    restart: unless-stopped
    depends_on:
      hive-metastore:
        condition: service_healthy
    environment:
      SERVICE_NAME: hiveserver2
      IS_RESUME: "true"
      HIVE_SERVER2_THRIFT_PORT: 10000
      SERVICE_OPTS: "-Dhive.metastore.uris=thrift://hive-metastore:9083"
      AWS_ACCESS_KEY: admin
      AWS_SECRET_ACCESS_KEY: password
    volumes:
      - ./logs/hiveserver/:/tmp/hive/
    ports:
      - "10000:10000"
      - "10002:10002"
    healthcheck:
      # HiveServer2 had no healthcheck, so it reported no status at all and nothing
      # could depend on it being ready. 10000 is the Thrift/JDBC port beeline uses.
      # 180s of grace: it waits on the metastore, then initialises its own session
      # manager, and 60s was not enough once the "all" profile was competing for CPU.
      test: bash -c "exec 6<> /dev/tcp/localhost/10000"
      start_period: 180s
      start_interval: 15s
      interval: 30s
      timeout: 30s
      retries: 5
    networks:
      - datalake

  spark-master:
    image: rangareddy1988/${SPARK_IMAGE:-ranga-spark}:${IMAGE_VERSION:-1.0.0}
    platform: ${PLATFORM:-linux/amd64}
    container_name: spark-master
    restart: unless-stopped
    user: root
    depends_on:
      hive-metastore:
        condition: service_healthy
    environment:
      # MinIO credentials and endpoint, the same on every service that reads or writes s3a://
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
      - AWS_DEFAULT_REGION=us-east-1
      - S3_PATH_STYLE_ACCESS=true
      - AWS_ENDPOINT_URL=http://minio:9000
      - SPARK_MODE=master
    ports:
      - "8080:8080"
      - "7077:7077"
      - "14040-14042:4040-4042"
      - "18080:18080"
    volumes:
      - ./data/spark-events:/opt/spark/spark-events
      - ./logs/spark-master:/var/log/spark
    healthcheck:
      test: bash -c "exec 6<> /dev/tcp/localhost/8080"
      start_period: 20s
      interval: 30s
      timeout: 30s
      retries: 5
    networks:
      - datalake

  spark-worker:
    image: rangareddy1988/${SPARK_IMAGE:-ranga-spark}:${IMAGE_VERSION:-1.0.0}
    platform: ${PLATFORM:-linux/amd64}
    container_name: spark-worker
    restart: unless-stopped
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      # MinIO credentials and endpoint, the same on every service that reads or writes s3a://
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
      - AWS_DEFAULT_REGION=us-east-1
      - S3_PATH_STYLE_ACCESS=true
      - AWS_ENDPOINT_URL=http://minio:9000
      - SPARK_MODE=worker
      - SPARK_MASTER_HOST=spark-master
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=4G
      - SPARK_WORKER_WEBUI_PORT=8081
    ports:
      - "18081:8081"
    volumes:
      - ./logs/spark-worker:/var/log/spark
    healthcheck:
      test: bash -c "exec 6<> /dev/tcp/localhost/8081"
      start_period: 20s
      interval: 30s
      timeout: 30s
      retries: 5
    networks:
      - datalake

  postgres:
    image: rangareddy1988/ranga-postgres:${IMAGE_VERSION:-1.0.0}
    platform: ${PLATFORM:-linux/amd64}
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - ./db_scripts/postgres/db_init.sql:/docker-entrypoint-initdb.d/1_db_init.sql
      - ./db_scripts/postgres/employees.sql:/docker-entrypoint-initdb.d/2_employees.sql
      - ./db_scripts/postgres/multi_table_data.sql:/docker-entrypoint-initdb.d/3_data.sql
      - ./data/postgres:/var/lib/postgresql/data
    command: ["postgres", "-c", "wal_level=logical"]
    healthcheck:
      test: ["CMD", "psql", "-U", "postgres", "-c", "SELECT 1"]
      start_period: 20s
      interval: 30s
      timeout: 30s
      retries: 5
    networks:
      - datalake

  mysql:
    image: rangareddy1988/ranga-mysql:${IMAGE_VERSION:-1.0.0}
    platform: ${PLATFORM:-linux/amd64}
    container_name: mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-password}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-default}
      - MYSQL_USER=${MYSQL_USER:-admin}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-password}
    ports:
      - "3306:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./db_scripts/mysql:/docker-entrypoint-initdb.d
    command:
      [
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci",
        "--default-authentication-plugin=caching_sha2_password",
      ]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      start_period: 20s
      interval: 30s
      timeout: 30s
      retries: 5
    networks:
      - datalake

  minio:
    image: rangareddy1988/ranga-minio:${IMAGE_VERSION:-1.0.0}
    platform: ${PLATFORM:-linux/amd64}
    container_name: minio
    restart: unless-stopped
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password
      - MINIO_DOMAIN=minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio:/data
    command: ["server", "/data", "--console-address", ":9001"]
    healthcheck:
      # MinIO's own liveness endpoint, not a bare TCP probe: an open port only says
      # the process bound it, while /minio/health/live says the object store is
      # actually serving. ranga-minio also declares this as a HEALTHCHECK, so a
      # plain "docker run" of the image reports the same thing.
      test: curl -fsS http://localhost:9000/minio/health/live || exit 1
      start_period: 20s
      interval: 30s
      timeout: 30s
      retries: 5
    networks:
      datalake:
        aliases:
          - warehouse.minio

  mc:
    # The MinIO server image already contains the mc client at /usr/bin/mc, so there is
    # no separate client image: this is ranga-minio with a different entrypoint.
    image: rangareddy1988/ranga-minio:${IMAGE_VERSION:-1.0.0}
    platform: ${PLATFORM:-linux/amd64}
    container_name: mc
    depends_on:
      minio:
        condition: service_healthy
    environment:
      # MinIO credentials and endpoint, the same on every service that reads or writes s3a://
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
      - AWS_DEFAULT_REGION=us-east-1
      - S3_PATH_STYLE_ACCESS=true
      - AWS_ENDPOINT_URL=http://minio:9000
    entrypoint: >
      /bin/sh -c " 
      until (/usr/bin/mc alias set minio http://minio:9000 admin password) do echo '...waiting...' && sleep 1; done;
      /usr/bin/mc mb --ignore-existing minio/warehouse;
      /usr/bin/mc mb --ignore-existing minio/datalake;
      /usr/bin/mc anonymous set public minio/warehouse;
      /usr/bin/mc anonymous set public minio/datalake;
      tail -f /dev/null
      "
    healthcheck:
      # ranga-minio declares a HEALTHCHECK against the MinIO server's /minio/health/live.
      # This container runs the client, not the server, so that probe would fail forever
      # and report a working sidecar as unhealthy.
      disable: true
    networks:
      - datalake

  trino:
    image: rangareddy1988/ranga-trino:${IMAGE_VERSION:-1.0.0}
    platform: ${PLATFORM:-linux/amd64}
    container_name: trino
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
      hive-metastore:
        condition: service_healthy
    ports:
      - "9084:8080"
    healthcheck:
      # /v1/info answering is not the same as Trino being ready: it serves that
      # endpoint while still reporting {"starting":true} and failing every query with
      # "Trino server is still initializing". Grep the field, or the container goes
      # healthy minutes before it can answer a SELECT.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/v1/info | grep -q '\"starting\":false'"]
      start_period: 180s
      start_interval: 15s
      interval: 30s
      timeout: 30s
      retries: 5
    networks:
      - datalake

  jupyter-notebook:
    # The Spark image, in notebook mode. It already installs JupyterLab plus the
    # Python, Scala (spylon) and Java (IJava) kernels, so a separate 3.2GB jupyter
    # image was duplicating all of it - and a notebook sitting next to Spark can
    # actually use Spark, which the standalone one could not.
    image: rangareddy1988/${SPARK_IMAGE:-ranga-spark}:${IMAGE_VERSION:-1.0.0}
    platform: ${PLATFORM:-linux/amd64}
    container_name: jupyter-notebook
    restart: unless-stopped
    user: root
    depends_on:
      minio:
        condition: service_healthy
      hive-metastore:
        condition: service_healthy
    environment:
      # MinIO credentials and endpoint, the same on every service that reads or writes s3a://
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
      - AWS_DEFAULT_REGION=us-east-1
      - S3_PATH_STYLE_ACCESS=true
      - AWS_ENDPOINT_URL=http://minio:9000
      - SPARK_MODE=notebook
    volumes:
      - ./data/notebooks:/opt/notebooks/work
      - ./logs/jupyter:/var/log/spark
    ports:
      - "8888:8888"
    healthcheck:
      # /api, not a TCP probe: it answers with the server version once Lab is actually
      # serving, which an open port does not tell you. 120s of grace because the first
      # start builds Lab's asset index and is slow on a loaded machine.
      test: curl -fsS http://localhost:8888/api || exit 1
      start_period: 120s
      start_interval: 10s
      interval: 30s
      timeout: 30s
      retries: 5
    networks:
      - datalake

networks:
  datalake:
    name: datalake
